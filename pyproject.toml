[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-book-learning-skill"
version = "0.1.0"
description = "Agent Skill for turning ebooks into source-traceable deep learning projects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deep Book Learning contributors"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
all = ["pypdf>=4", "python-docx>=1"]

[tool.setuptools]
packages = ["deep_book_learning"]
